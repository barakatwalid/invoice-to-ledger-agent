<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">Invoice-to-Ledger AI Agent dashboard overview</title>
  <desc id="desc">Synthetic illustration of the private Telnyx-hosted invoice review dashboard.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef8f1"/>
      <stop offset=".55" stop-color="#f7f7f2"/>
      <stop offset="1" stop-color="#f1effd"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14261e"/>
      <stop offset="1" stop-color="#1f5a40"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#1d3528" flood-opacity=".12"/>
    </filter>
    <style>
      .sans{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .label{font-size:13px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase}
      .muted{fill:#6d7972}.ink{fill:#13231b}.green{fill:#0e7650}.teal{fill:#0b7d88}.purple{fill:#6149d7}
      .card{fill:#fff;stroke:#dce5df;stroke-width:1}.soft{fill:#f4f7f5}.line{stroke:#dce5df;stroke-width:1}
    </style>
  </defs>
  <rect width="1440" height="760" fill="url(#bg)"/>
  <rect width="1440" height="8" fill="#0e7650"/>
  <rect x="52" y="42" width="1336" height="672" rx="28" class="card" filter="url(#shadow)"/>

  <g class="sans">
    <text x="92" y="90" class="label green">TELNYX EDGE · PRIVATE REVIEW</text>
    <text x="92" y="137" font-size="38" font-weight="800" class="ink">Invoice processing dashboard</text>
    <text x="92" y="166" font-size="16" class="muted">Completeness, extraction, accounting suggestions and independent reconciliation</text>
    <rect x="1174" y="83" width="164" height="38" rx="19" fill="#e3f4eb"/>
    <circle cx="1200" cy="102" r="6" fill="#0e7650"/>
    <text x="1218" y="108" font-size="14" font-weight="800" class="green">Ready for review</text>

    <line x1="344" y1="200" x2="344" y2="672" stroke="#ccd8d0"/>
    <text x="92" y="226" class="label teal">LIVE INBOX MONITOR</text>
    <text x="92" y="257" font-size="22" font-weight="800" class="ink">Telnyx inbox</text>
    <text x="92" y="281" font-size="13" class="muted">Read-only intake status</text>

    <g transform="translate(92 306)">
      <rect width="104" height="78" rx="14" fill="#f1f6f3"/>
      <text x="14" y="25" font-size="11" font-weight="800" class="muted">RECEIVED</text>
      <text x="14" y="60" font-size="29" font-weight="800" class="ink">15</text>
      <rect x="116" width="104" height="78" rx="14" fill="#f1f6f3"/>
      <text x="130" y="25" font-size="11" font-weight="800" class="muted">PROCESSED</text>
      <text x="130" y="60" font-size="29" font-weight="800" class="ink">15</text>
      <rect y="90" width="104" height="78" rx="14" fill="#f1f6f3"/>
      <text x="14" y="115" font-size="11" font-weight="800" class="muted">WAITING</text>
      <text x="14" y="150" font-size="29" font-weight="800" class="ink">0</text>
      <rect x="116" y="90" width="104" height="78" rx="14" fill="#f1f6f3"/>
      <text x="130" y="115" font-size="11" font-weight="800" class="muted">FAILED</text>
      <text x="130" y="150" font-size="29" font-weight="800" class="ink">0</text>
    </g>

    <rect x="92" y="496" width="220" height="76" rx="14" fill="#e4f4f4"/>
    <circle cx="112" cy="518" r="6" fill="#0b7d88"/>
    <text x="130" y="523" font-size="12" font-weight="800" class="teal">LATEST DOCUMENT</text>
    <text x="112" y="550" font-size="14" font-weight="700" class="ink">synthetic-invoice.pdf</text>
    <text x="92" y="613" font-size="12" class="muted">Intake path</text>
    <text x="92" y="638" font-size="14" font-weight="800" class="ink">Embedded-text PDF</text>

    <g transform="translate(382 205)">
      <rect width="290" height="158" rx="20" fill="url(#dark)"/>
      <text x="24" y="32" class="label" fill="#a8d8bf">PRINTED TOTAL</text>
      <text x="24" y="91" font-size="43" font-weight="800" fill="#fff">USD 150.00</text>
      <line x1="24" y1="113" x2="266" y2="113" stroke="#ffffff30"/>
      <text x="24" y="140" font-size="12" fill="#bad4c5">Subtotal 140.00</text>
      <text x="173" y="140" font-size="12" fill="#bad4c5">Tax 10.00</text>
    </g>

    <g transform="translate(690 205)">
      <rect width="310" height="158" rx="20" class="card"/>
      <text x="24" y="32" class="label green">EXTRACTION</text>
      <text x="24" y="69" font-size="18" font-weight="800" class="ink">Northwind Office Supply</text>
      <text x="24" y="98" font-size="13" class="muted">Invoice SYN-2026-001</text>
      <rect x="24" y="119" width="126" height="25" rx="12" fill="#e3f4eb"/>
      <text x="42" y="136" font-size="11" font-weight="800" class="green">Evidence valid</text>
    </g>

    <g transform="translate(1018 205)">
      <rect width="320" height="158" rx="20" class="card"/>
      <text x="24" y="32" class="label purple">COMPLETENESS</text>
      <text x="24" y="81" font-size="31" font-weight="800" class="ink">15 / 15</text>
      <text x="24" y="108" font-size="13" class="muted">Expected invoices received</text>
      <rect x="24" y="121" width="132" height="25" rx="12" fill="#f0edff"/>
      <text x="41" y="138" font-size="11" font-weight="800" class="purple">Count complete</text>
    </g>

    <g transform="translate(382 383)">
      <rect width="468" height="236" rx="20" class="card"/>
      <rect width="468" height="6" rx="3" fill="#6149d7"/>
      <text x="24" y="41" class="label purple">ACCOUNTING SUGGESTION</text>
      <text x="24" y="72" font-size="21" font-weight="800" class="ink">Human-review proposal</text>
      <line x1="24" y1="93" x2="444" y2="93" class="line"/>
      <text x="24" y="120" font-size="11" font-weight="800" class="muted">SIDE</text>
      <text x="108" y="120" font-size="11" font-weight="800" class="muted">ACCOUNT</text>
      <text x="397" y="120" font-size="11" font-weight="800" class="muted">AMOUNT</text>
      <rect x="24" y="138" width="58" height="24" rx="8" fill="#e3f4eb"/>
      <text x="34" y="155" font-size="11" font-weight="800" class="green">DEBIT</text>
      <text x="108" y="155" font-size="14" font-weight="700" class="ink">Operating expense</text>
      <text x="377" y="155" font-size="14" font-weight="800" class="ink">150.00</text>
      <rect x="24" y="177" width="58" height="24" rx="8" fill="#edf1fb"/>
      <text x="31" y="194" font-size="11" font-weight="800" fill="#5066a1">CREDIT</text>
      <text x="108" y="194" font-size="14" font-weight="700" class="ink">Accounts payable</text>
      <text x="377" y="194" font-size="14" font-weight="800" class="ink">150.00</text>
      <text x="24" y="221" font-size="11" class="muted">No automatic ledger posting</text>
    </g>

    <g transform="translate(868 383)">
      <rect width="470" height="236" rx="20" class="card"/>
      <rect width="470" height="6" rx="3" fill="#0b7d88"/>
      <text x="24" y="41" class="label teal">RECONCILIATION</text>
      <text x="24" y="72" font-size="21" font-weight="800" class="ink">Exact-decimal checks</text>
      <g transform="translate(24 101)">
        <circle cx="10" cy="8" r="10" fill="#e3f4eb"/>
        <path d="M5 8l3 3 7-7" fill="none" stroke="#0e7650" stroke-width="2"/>
        <text x="31" y="13" font-size="14" class="ink">Line extensions match</text>
        <circle cx="10" cy="50" r="10" fill="#e3f4eb"/>
        <path d="M5 50l3 3 7-7" fill="none" stroke="#0e7650" stroke-width="2"/>
        <text x="31" y="55" font-size="14" class="ink">Subtotal + tax = total</text>
        <circle cx="10" cy="92" r="10" fill="#e3f4eb"/>
        <path d="M5 92l3 3 7-7" fill="none" stroke="#0e7650" stroke-width="2"/>
        <text x="31" y="97" font-size="14" class="ink">Debits equal credits</text>
      </g>
    </g>

    <rect x="382" y="640" width="956" height="42" rx="12" fill="#f0edff"/>
    <text x="404" y="666" font-size="13" font-weight="800" class="purple">🔒 Review only · no payment, tax filing or automatic accounting entry</text>
    <text x="1170" y="698" font-size="11" class="muted">Synthetic portfolio illustration</text>
  </g>
</svg>
